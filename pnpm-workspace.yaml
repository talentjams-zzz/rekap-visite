---
packages:
  - server
  - web
  - e2e
# Approve postinstall build scripts declaratively (pnpm >= 10 blocks them by
# default; without this, `pnpm install` errors with ERR_PNPM_IGNORED_BUILDS).
# pnpm 11+ uses `allowBuilds` (the old onlyBuiltDependencies key is ignored).
# esbuild is the only dependency that needs it.
allowBuilds:
  esbuild: true
